name: Code Format

on:
  push:
    branches: [main]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '.clang-format'
      - '.github/workflows/clang-format.yml'
  workflow_dispatch:

jobs:
  clang-format:
    # Skip if commit is from this workflow (auto-format PR merge)
    if: "!contains(github.event.head_commit.message, 'style: auto-format code with clang-format')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Import GPG key (optional, for signed commits)
        env:
          CI_GPG_PRIVATE_KEY: ${{ secrets.CI_GPG_PRIVATE_KEY }}
          CI_GPG_FINGERPRINT: ${{ secrets.CI_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail

          if [ -z "${CI_GPG_PRIVATE_KEY:-}" ]; then
            echo "CI_GPG_PRIVATE_KEY is not set; skipping GPG import."
            exit 0
          fi

          echo "$CI_GPG_PRIVATE_KEY" | gpg --batch --import

          SIGNING_FPR="${CI_GPG_FINGERPRINT:-}"
          if [ -z "$SIGNING_FPR" ]; then
            SIGNING_FPR="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          fi
          if [ -z "$SIGNING_FPR" ]; then
            echo "Failed to detect GPG signing key fingerprint." >&2
            exit 1
          fi

          printf '%s:6:\n' "$SIGNING_FPR" | gpg --batch --import-ownertrust

          git config --global gpg.program gpg
          git config --global commit.gpgsign true
          git config --global user.signingkey "$SIGNING_FPR"

      - name: Run clang-format
        run: |
          find src HandTracker -name '*.cpp' -o -name '*.h' -o -name '*.hpp' | \
            xargs clang-format-18 -i

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-format
          title: "style: auto-format code with clang-format"
          body: |
            This PR was automatically generated by the clang-format workflow.
            
            Please review the formatting changes before merging.
          commit-message: "style: auto-format code with clang-format"
          committer: "NewbieXvwu <NewbieXvwu@qq.com>"
          author: "NewbieXvwu <NewbieXvwu@qq.com>"
          labels: automated
          delete-branch: true
