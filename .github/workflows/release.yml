name: Build Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Compute submodule cache key
        id: submodule-key
        run: |
          # Key must change when the expected submodule SHAs change (even if .gitmodules stays the same).
          echo "sha=$(git submodule status --recursive | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Cache submodules
        id: cache-submodules
        uses: actions/cache@v4
        with:
          path: |
            HandTracker/libs/opencv
            HandTracker/libs/tensorflow
            libs/imgui
            libs/DiligentCore
          key: submodules-${{ hashFiles('.gitmodules') }}-${{ steps.submodule-key.outputs.sha }}
          restore-keys: |
            submodules-${{ hashFiles('.gitmodules') }}-
            submodules-

      - name: Initialize submodules (cache miss)
        if: steps.cache-submodules.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --recursive --depth 1
        shell: bash

      - name: Verify submodules (cache hit)
        if: steps.cache-submodules.outputs.cache-hit == 'true'
        run: |
          # Ensure .git directories are properly linked
          git submodule update --init --recursive --depth 1 2>/dev/null || true
        shell: bash

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        run: vcpkg integrate install

      - name: Set version name
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            echo "name=${{ github.event.release.tag_name }}" >> $env:GITHUB_OUTPUT
          } else {
            # Use short hash (7 chars) for manual builds
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            echo "name=$shortSha" >> $env:GITHUB_OUTPUT
          }

      - name: Cache TFLite build
        id: cache-tflite
        uses: actions/cache@v4
        with:
          path: |
            HandTracker/libs/tensorflow/tflite_build/install
            HandTracker/libs/tensorflow/tflite_build/MinSizeRel
            HandTracker/libs/tensorflow/tflite_build/_deps/abseil-cpp-build
          key: tflite-vs2022-static-${{ hashFiles('scripts/build_tflite.cmd') }}
          restore-keys: |
            tflite-vs2022-static-

      - name: Apply TFLite patch
        if: steps.cache-tflite.outputs.cache-hit != 'true'
        run: git apply scripts/tflite-prune.patch --directory=HandTracker/libs/tensorflow

      - name: Build TFLite
        if: steps.cache-tflite.outputs.cache-hit != 'true'
        run: scripts\build_tflite.cmd
        shell: cmd

      - name: Cache OpenCV build
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: HandTracker/libs/opencv/build/install
          key: opencv-4130-vs2022-static-${{ hashFiles('scripts/build_opencv.cmd') }}
          restore-keys: |
            opencv-4130-vs2022-static-

      - name: Build OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: scripts\build_opencv.cmd
        shell: cmd

      - name: Apply ImGui MD3 patch
        run: git apply scripts/imgui_md3.patch --directory=libs/imgui
        shell: bash

      # ============================================================================
      # Build HandTracker first (shared dependency)
      # ============================================================================
      - name: Build HandTracker Release
        run: msbuild HandTracker\HandTracker.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:OpenCVRuntime=vc17 /m

      - name: Build HandTracker Release_Static
        run: msbuild HandTracker\HandTracker.vcxproj /p:Configuration=Release_Static /p:Platform=x64 /p:PlatformToolset=v143 /p:OpenCVRuntime=vc17 /m

      # ============================================================================
      # OpenGL version builds
      # ============================================================================
      - name: Build OpenGL Release
        run: msbuild ParticleSaturn.OpenGL.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:OpenCVRuntime=vc17 /p:VcpkgEnableManifest=true /p:AppVersion=${{ steps.version.outputs.name }} /m

      - name: Build OpenGL ReleaseStatic
        run: msbuild ParticleSaturn.OpenGL.vcxproj /p:Configuration=Release_Static /p:Platform=x64 /p:PlatformToolset=v143 /p:OpenCVRuntime=vc17 /p:VcpkgEnableManifest=true /p:AppVersion=${{ steps.version.outputs.name }} /m

      # ============================================================================
      # Diligent version builds (uses CMake via PowerShell script)
      # ============================================================================
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Build Diligent Release
        run: .\scripts\build_diligent.ps1 -Action build -SrcDir . -BuildDir bin_diligent\x64\Release -Config Release -HandTrackerLinkMode dll
        shell: pwsh

      - name: Stage HandTracker for Diligent Release
        run: .\scripts\stage_handtracker.ps1 -SrcDir . -OutDir bin_diligent\x64\Release -Platform x64 -HandTrackerConfig Release -LinkMode dll
        shell: pwsh

      - name: Build Diligent ReleaseStatic
        run: .\scripts\build_diligent.ps1 -Action build -SrcDir . -BuildDir bin_diligent\x64\Release_Static -Config Release -HandTrackerLinkMode static
        shell: pwsh

      # ============================================================================
      # Prepare artifacts
      # ============================================================================
      - name: Prepare OpenGL Release artifacts
        run: |
          $releaseDir = "release_artifacts_opengl"
          New-Item -ItemType Directory -Force -Path $releaseDir

          # Copy Release build files
          Copy-Item "bin/x64/Release/ParticleSaturn.exe" $releaseDir/
          Copy-Item "bin/x64/Release/HandTracker.dll" $releaseDir/
          Copy-Item "bin/x64/Release/glfw3.dll" $releaseDir/

          # Copy model files
          Copy-Item "HandTracker/models/palm_detection_full.tflite" $releaseDir/
          Copy-Item "HandTracker/models/hand_landmark_full.tflite" $releaseDir/

      - name: Prepare Diligent Release artifacts
        run: |
          $releaseDir = "release_artifacts_diligent"
          New-Item -ItemType Directory -Force -Path $releaseDir

          # Copy Diligent Release build files
          Copy-Item "bin_diligent/x64/Release/ParticleSaturn.Diligent.exe" $releaseDir/
          Copy-Item "bin_diligent/x64/Release/HandTracker.dll" $releaseDir/

          # Copy model files
          Copy-Item "HandTracker/models/palm_detection_full.tflite" $releaseDir/
          Copy-Item "HandTracker/models/hand_landmark_full.tflite" $releaseDir/

      # ============================================================================
      # Create archives
      # ============================================================================
      - name: Create OpenGL 7z archive
        run: 7z a -t7z -mx=9 ParticleSaturn-OpenGL-${{ steps.version.outputs.name }}.7z ./release_artifacts_opengl/*

      - name: Create OpenGL zip archive
        run: 7z a -tzip -mx=9 ParticleSaturn-OpenGL-${{ steps.version.outputs.name }}.zip ./release_artifacts_opengl/*

      - name: Create Diligent 7z archive
        run: 7z a -t7z -mx=9 ParticleSaturn-Diligent-${{ steps.version.outputs.name }}.7z ./release_artifacts_diligent/*

      - name: Create Diligent zip archive
        run: 7z a -tzip -mx=9 ParticleSaturn-Diligent-${{ steps.version.outputs.name }}.zip ./release_artifacts_diligent/*

      # ============================================================================
      # Upload artifacts
      # ============================================================================
      - name: Upload artifact (OpenGL Release)
        uses: actions/upload-artifact@v4
        with:
          name: ParticleSaturn-OpenGL-${{ steps.version.outputs.name }}
          path: release_artifacts_opengl/

      - name: Upload artifact (Diligent Release)
        uses: actions/upload-artifact@v4
        with:
          name: ParticleSaturn-Diligent-${{ steps.version.outputs.name }}
          path: release_artifacts_diligent/

      - name: Upload artifact (OpenGL Static)
        uses: actions/upload-artifact@v4
        with:
          name: ParticleSaturn-OpenGL-Static-${{ steps.version.outputs.name }}
          path: bin/x64/Release_Static/ParticleSaturn.exe

      - name: Upload artifact (Diligent Static)
        uses: actions/upload-artifact@v4
        with:
          name: ParticleSaturn-Diligent-Static-${{ steps.version.outputs.name }}
          path: bin_diligent/x64/Release_Static/ParticleSaturn.Diligent.exe

      - name: Upload PDB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDB-${{ steps.version.outputs.name }}
          path: |
            bin/x64/Release/ParticleSaturn.pdb
            bin/x64/Release/HandTracker.pdb
            bin/x64/Release_Static/ParticleSaturn.pdb
            bin_diligent/x64/Release/ParticleSaturn.Diligent.pdb
            bin_diligent/x64/Release_Static/ParticleSaturn.Diligent.pdb

      # ============================================================================
      # Upload to GitHub Release
      # ============================================================================
      - name: Upload Release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ParticleSaturn-OpenGL-${{ steps.version.outputs.name }}.7z
            ParticleSaturn-OpenGL-${{ steps.version.outputs.name }}.zip
            ParticleSaturn-Diligent-${{ steps.version.outputs.name }}.7z
            ParticleSaturn-Diligent-${{ steps.version.outputs.name }}.zip
            bin/x64/Release_Static/ParticleSaturn.exe
            bin_diligent/x64/Release_Static/ParticleSaturn.Diligent.exe

      - name: Upload PDB to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/x64/Release_Static/ParticleSaturn.pdb
            bin_diligent/x64/Release_Static/ParticleSaturn.Diligent.pdb
