name: Build Release

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/build_tflite.cmd'
      - 'scripts/build_opencv.cmd'
      - 'patches/tflite-prune.patch'
      - 'patches/tflite-elementwise-compat.patch'
      - 'patches/imgui-md3.patch'
      - 'scripts/apply_third_party_patch.cmake'
      - 'scripts/apply_third_party_patch.sh'
      - 'HandTracker/libs/tensorflow/tensorflow/lite/**'
      - 'HandTracker/libs/opencv/modules/core/**'

permissions:
  contents: write

jobs:
  # ============================================================================
  # Job 1: Build TensorFlow Lite
  # ============================================================================
  build-tflite:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      cache-hit: ${{ steps.cache-tflite.outputs.cache-hit }}
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache TFLite build
        id: cache-tflite
        uses: actions/cache@v4
        with:
          path: HandTracker/libs/tensorflow/tflite_build/install
          key: tflite-vs2022-static-${{ hashFiles('scripts/build_tflite.cmd', 'patches/tflite-prune.patch', 'patches/tflite-elementwise-compat.patch', 'HandTracker/libs/tensorflow/tensorflow/lite/**/*.cc', 'HandTracker/libs/tensorflow/tensorflow/lite/**/*.h') }}
          restore-keys: |
            tflite-vs2022-static-${{ hashFiles('scripts/build_tflite.cmd') }}-
            tflite-vs2022-static-

      - name: Enable long paths
        if: steps.cache-tflite.outputs.cache-hit != 'true'
        run: reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

      - name: Apply TFLite patches
        if: steps.cache-tflite.outputs.cache-hit != 'true'
        run: sh scripts/apply_third_party_patch.sh tensorflow-lite
        shell: bash

      - name: Build TFLite
        if: steps.cache-tflite.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: scripts\build_tflite.cmd
        shell: cmd

      - name: Save TFLite Cache
        if: steps.cache-tflite.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: HandTracker/libs/tensorflow/tflite_build/install
          key: ${{ steps.cache-tflite.outputs.cache-primary-key }}

  # ============================================================================
  # Job 2: Build OpenCV
  # ============================================================================
  build-opencv:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      cache-hit: ${{ steps.cache-opencv.outputs.cache-hit }}
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache OpenCV build
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: HandTracker/libs/opencv/build/install
          key: opencv-4130-vs2022-static-${{ hashFiles('scripts/build_opencv.cmd', 'HandTracker/libs/opencv/modules/core/**/*.cpp', 'HandTracker/libs/opencv/modules/core/**/*.hpp') }}
          restore-keys: |
            opencv-4130-vs2022-static-${{ hashFiles('scripts/build_opencv.cmd') }}-
            opencv-4130-vs2022-static-

      - name: Build OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: scripts\build_opencv.cmd
        shell: cmd

      - name: Save OpenCV Cache
        if: steps.cache-opencv.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: HandTracker/libs/opencv/build/install
          key: ${{ steps.cache-opencv.outputs.cache-primary-key }}

  # ============================================================================
  # Job 3: Build Base Components (HandTracker)
  # ============================================================================
  build-base:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [build-tflite, build-opencv]
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.version.outputs.name }}
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set version name
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            echo "name=${{ github.event.release.tag_name }}" >> $env:GITHUB_OUTPUT
          } else {
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            echo "name=$shortSha" >> $env:GITHUB_OUTPUT
          }

      - name: Restore TFLite Cache
        uses: actions/cache/restore@v4
        with:
          path: HandTracker/libs/tensorflow/tflite_build/install
          key: tflite-vs2022-static-${{ hashFiles('scripts/build_tflite.cmd', 'patches/tflite-prune.patch', 'patches/tflite-elementwise-compat.patch', 'HandTracker/libs/tensorflow/tensorflow/lite/**/*.cc', 'HandTracker/libs/tensorflow/tensorflow/lite/**/*.h') }}
          fail-on-cache-miss: true

      - name: Restore OpenCV Cache
        uses: actions/cache/restore@v4
        with:
          path: HandTracker/libs/opencv/build/install
          key: opencv-4130-vs2022-static-${{ hashFiles('scripts/build_opencv.cmd', 'HandTracker/libs/opencv/modules/core/**/*.cpp', 'HandTracker/libs/opencv/modules/core/**/*.hpp') }}
          fail-on-cache-miss: true

      - name: Setup vcpkg
        run: vcpkg integrate install

      - name: Ensure imgui submodule is at correct commit
        run: git submodule update --init --force libs/imgui
        shell: bash

      - name: Apply ImGui MD3 patch
        run: sh scripts/apply_third_party_patch.sh imgui-md3
        shell: bash

      - name: Build HandTracker Release
        run: msbuild HandTracker\HandTracker.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:OpenCVRuntime=vc17 /m

      - name: Build HandTracker Release_Static
        run: msbuild HandTracker\HandTracker.vcxproj /p:Configuration=Release_Static /p:Platform=x64 /p:PlatformToolset=v143 /p:OpenCVRuntime=vc17 /m

      - name: Upload HandTracker Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: handtracker-build
          path: |
            bin/x64/
            HandTracker/models/
          retention-days: 1

  # ============================================================================
  # Job 4: Build OpenGL Version
  # ============================================================================
  build-opengl:
    needs: build-base
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        run: vcpkg integrate install

      - name: Download HandTracker Artifacts
        uses: actions/download-artifact@v4
        with:
          name: handtracker-build
          path: ${{ github.workspace }}

      - name: Ensure imgui submodule is at correct commit
        run: git submodule update --init --force libs/imgui
        shell: bash

      - name: Apply ImGui MD3 patch
        run: sh scripts/apply_third_party_patch.sh imgui-md3
        shell: bash

      - name: Build OpenGL Release
        run: msbuild ParticleSaturn.OpenGL.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:OpenCVRuntime=vc17 /p:VcpkgEnableManifest=true /p:AppVersion=${{ needs.build-base.outputs.name }} /m

      - name: Build OpenGL ReleaseStatic
        run: msbuild ParticleSaturn.OpenGL.vcxproj /p:Configuration=Release_Static /p:Platform=x64 /p:PlatformToolset=v143 /p:OpenCVRuntime=vc17 /p:VcpkgEnableManifest=true /p:AppVersion=${{ needs.build-base.outputs.name }} /m

      - name: Prepare OpenGL Release artifacts
        run: |
          $releaseDir = "release_artifacts_opengl"
          New-Item -ItemType Directory -Force -Path $releaseDir
          Copy-Item "bin/x64/Release/ParticleSaturn.OpenGL.exe" $releaseDir/
          Copy-Item "bin/x64/Release/HandTracker.dll" $releaseDir/
          Copy-Item "bin/x64/Release/glfw3.dll" $releaseDir/
          Copy-Item "HandTracker/models/palm_detection_full.tflite" $releaseDir/
          Copy-Item "HandTracker/models/hand_landmark_full.tflite" $releaseDir/

      - name: Create OpenGL archives
        run: |
          7z a -t7z -mx=9 ParticleSaturn-OpenGL-${{ needs.build-base.outputs.name }}.7z ./release_artifacts_opengl/*
          7z a -tzip -mx=9 ParticleSaturn-OpenGL-${{ needs.build-base.outputs.name }}.zip ./release_artifacts_opengl/*

      - name: Upload OpenGL Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ParticleSaturn-OpenGL-${{ needs.build-base.outputs.name }}
          path: release_artifacts_opengl/

      - name: Upload OpenGL Static Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParticleSaturn-OpenGL-Static-${{ needs.build-base.outputs.name }}
          path: bin/x64/Release_Static/ParticleSaturn.OpenGL.exe

      - name: Upload OpenGL PDBs
        uses: actions/upload-artifact@v4
        with:
          name: PDB-OpenGL-${{ needs.build-base.outputs.name }}
          path: |
            bin/x64/Release/ParticleSaturn.OpenGL.pdb
            bin/x64/Release/HandTracker.pdb
            bin/x64/Release_Static/ParticleSaturn.OpenGL.pdb

  # ============================================================================
  # Job 5: Build Diligent Version
  # ============================================================================
  build-diligent:
    needs: build-base
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set version name
        id: version
        run: |
          echo "name=${{ needs.build-base.outputs.name }}" >> $env:GITHUB_OUTPUT

      - name: Download HandTracker Artifacts
        uses: actions/download-artifact@v4
        with:
          name: handtracker-build
          path: ${{ github.workspace }}

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: amd64

      - name: Ensure imgui submodule is at correct commit
        run: git submodule update --init --force libs/imgui
        shell: bash

      - name: Apply ImGui MD3 patch
        run: sh scripts/apply_third_party_patch.sh imgui-md3
        shell: bash

      - name: Build Diligent Release
        run: .\scripts\build_diligent.ps1 -Action build -SrcDir . -BuildDir bin_diligent\x64\Release -Config Release -HandTrackerLinkMode dll
        shell: pwsh

      - name: Stage HandTracker for Diligent Release
        run: .\scripts\stage_handtracker.ps1 -SrcDir . -OutDir bin_diligent\x64\Release -Platform x64 -HandTrackerConfig Release -LinkMode dll
        shell: pwsh

      - name: Build Diligent ReleaseStatic
        run: .\scripts\build_diligent.ps1 -Action build -SrcDir . -BuildDir bin_diligent\x64\Release_Static -Config Release -HandTrackerLinkMode static
        shell: pwsh

      - name: Prepare Diligent Release artifacts
        run: |
          $releaseDir = "release_artifacts_diligent"
          New-Item -ItemType Directory -Force -Path $releaseDir
          Copy-Item "bin_diligent/x64/Release/ParticleSaturn.Diligent.exe" $releaseDir/
          Copy-Item "bin_diligent/x64/Release/HandTracker.dll" $releaseDir/
          Copy-Item "HandTracker/models/palm_detection_full.tflite" $releaseDir/
          Copy-Item "HandTracker/models/hand_landmark_full.tflite" $releaseDir/

      - name: Create Diligent archives
        run: |
          7z a -t7z -mx=9 ParticleSaturn-Diligent-${{ steps.version.outputs.name }}.7z ./release_artifacts_diligent/*
          7z a -tzip -mx=9 ParticleSaturn-Diligent-${{ steps.version.outputs.name }}.zip ./release_artifacts_diligent/*

      - name: Upload Diligent Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ParticleSaturn-Diligent-${{ steps.version.outputs.name }}
          path: release_artifacts_diligent/

      - name: Upload Diligent Static Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParticleSaturn-Diligent-Static-${{ steps.version.outputs.name }}
          path: bin_diligent/x64/Release_Static/ParticleSaturn.Diligent.exe

      - name: Upload Diligent PDBs
        uses: actions/upload-artifact@v4
        with:
          name: PDB-Diligent-${{ steps.version.outputs.name }}
          path: |
            bin_diligent/x64/Release/ParticleSaturn.Diligent.pdb
            bin_diligent/x64/Release_Static/ParticleSaturn.Diligent.pdb

  # ============================================================================
  # Job 6: Upload to Release (Final job for dependency management)
  # ============================================================================
  upload-release:
    needs: [build-base, build-opengl, build-diligent]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download OpenGL artifacts
        uses: actions/download-artifact@v4
        with:
          name: ParticleSaturn-OpenGL-${{ needs.build-base.outputs.name }}
          path: ./release_artifacts_opengl/

      - name: Download Diligent artifacts
        uses: actions/download-artifact@v4
        with:
          name: ParticleSaturn-Diligent-${{ needs.build-base.outputs.name }}
          path: ./release_artifacts_diligent/

      - name: Upload Release assets
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: |
            ParticleSaturn-OpenGL-*.7z
            ParticleSaturn-OpenGL-*.zip
            ParticleSaturn-Diligent-*.7z
            ParticleSaturn-Diligent-*.zip
            bin/x64/Release_Static/ParticleSaturn.OpenGL.exe
            bin_diligent/x64/Release_Static/ParticleSaturn.Diligent.exe
            bin/x64/Release_Static/ParticleSaturn.OpenGL.pdb
            bin_diligent/x64/Release_Static/ParticleSaturn.Diligent.pdb
